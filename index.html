<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Integrasi Google Apps Script</title>
    <!-- Tailwind CSS untuk styling cepat dan rapi -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl w-full max-w-lg p-6 md:p-8 border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Formulir Web & Google Apps Script</h2>
        <p class="text-slate-500 text-sm mb-6">Hubungkan halaman statis GitHub Pages langsung ke Spreadsheet via GAS.</p>

        <!-- Form Input Data -->
        <form id="dataForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Masukkan nama Anda">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Pesan / Keterangan</label>
                <textarea id="pesan" name="pesan" rows="3" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Tulis pesan atau data di sini..."></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 cursor-pointer shadow-md">
                Kirim Data
            </button>
        </form>

        <!-- Status / Notifikasi -->
        <div id="statusMessage" class="mt-4 hidden p-3 rounded-lg text-sm text-center"></div>

        <!-- Tombol Test GET (Opsional) -->
        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <button onclick="testGetData()" class="text-sm text-blue-600 hover:underline font-medium">
                Test Ambil Data (GET Request)
            </button>
            <div id="getResult" class="mt-2 text-xs text-slate-600 bg-slate-100 p-2 rounded hidden"></div>
        </div>
    </div>

    <!-- Script JavaScript untuk komunikasi dengan GAS -->
    <script>
        // URL Web App Google Apps Script kamu
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP6OBcwWkeHY2mgqABsnku1hZBG2756go6YxZMYi5Zm3jVVzomeHrYVwNL1PY3w2Bq0g/exec";

        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Handle Pengiriman Form (POST)
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';
            statusMessage.classList.add('hidden');

            const formData = {
                nama: document.getElementById('nama').value,
                pesan: document.getElementById('pesan').value
            };

            try {
                // Catatan: Menggunakan mode 'no-cors' atau standar fetch tergantung setup doPost di GAS anda.
                // Jika ingin membaca respons JSON dari GAS, pastikan GAS mengembalikan ContentService.createTextOutput.
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Ubah jika script GAS sudah support CORS penuh
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                // Karena mode 'no-cors', respons tidak bisa dibaca isinya tapi request berhasil terkirim
                showStatus('Data berhasil dikirim ke Google Sheets!', 'success');
                form.reset();
            } catch (error) {
                console.error('Error:', error);
                showStatus('Terjadi kesalahan saat mengirim data.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Kirim Data';
            }
        });

        // Handle Ambil Data (GET)
        async function testGetData() {
            const getResultDiv = document.getElementById('getResult');
            getResultDiv.classList.remove('hidden');
            getResultDiv.textContent = 'Memuat data...';

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                getResultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error:', error);
                getResultDiv.textContent = 'Gagal mengambil data (pastikan doGet aktif di GAS).';
            }
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-700', 'bg-rose-100', 'text-rose-700');
            
            if (type === 'success') {
                statusMessage.classList.add('bg-emerald-100', 'text-emerald-700');
            } else {
                statusMessage.classList.add('bg-rose-100', 'text-rose-700');
            }
        }
    </script>
</body>
</html>
