<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    /* Animasi Loading Sederhana */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #475569;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Container Iframe */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh; /* Menggunakan dynamic viewport height agar pas di browser HP */
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Loading Screen saat Apps Script sedang cold-start -->
  <div id="loader">
    <div class="spinner"></div>
    <p style="font-size: 14px;">Memuat aplikasi...</p>
  </div>

  <!-- Embed URL Google Apps Script -->
  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbxP6OBcwWkeHY2mgqABsnku1hZBG2756go6YxZMYi5Zm3jVVzomeHrYVwNL1PY3w2Bq0g/exec"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 300);
    }
  </script>

</body>
</html>
