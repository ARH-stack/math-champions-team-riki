
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>My Web App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
        }

        .loading {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: #f8fafc;
            color: #334155;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #cbd5e1;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading p {
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .loading p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Memuat aplikasi...</p>
        </div>

        <iframe
            id="webapp"
            src="https://script.google.com/macros/s/AKfycbxP6OBcwWkeHY2mgqABsnku1hZBG2756go6YxZMYi5Zm3jVVzomeHrYVwNL1PY3w2Bq0g/exec"
            allow="fullscreen"
            allowfullscreen
            onload="hideLoading()">
        </iframe>

    </div>

    <script>
        function hideLoading() {
            const loading = document.getElementById("loading");
            loading.style.opacity = "0";

            setTimeout(() => {
                loading.style.display = "none";
            }, 300);
        }
    </script>

</body>
</html>
